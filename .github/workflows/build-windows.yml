name: Build Windows app

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
    paths:
      - ando_osa/**
      - osa_qt/**
      - assets/**
      - packaging/**
      - tests/**
      - requirements*.txt
      - CHANGELOG.md
      - .github/workflows/build-windows.yml
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release v<version> (tag created at this commit if missing)"
        type: boolean
        default: false

permissions:
  contents: write   # only used to attach the portable zip to a release on version tags

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Private data folder for the tests
        shell: pwsh
        run: '"KAYEI_OSA_HOME=$env:RUNNER_TEMP\kayei_osa" >> $env:GITHUB_ENV'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements-desktop.txt -r packaging/requirements-build.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'packaging'); import build_exe; print(build_exe.version())"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match ando_osa.__version__ $v"
          }
          # a push to main with a version that has no tag yet publishes the release
          $tagged = git ls-remote --tags origin "refs/tags/v$v"
          "untagged=$([string]::IsNullOrWhiteSpace($tagged))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Tests (engine, driver, simulator, desktop app offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q tests

      - name: Build app folder
        run: python packaging/build_exe.py

      - name: Smoke test (the packaged app opens, sweeps the simulator, exits; headless sweep works)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\kayei_spectrumstudio\kayei_spectrumstudio.exe" -ArgumentList "--smoke" -PassThru
          $finished = $p.WaitForExit(180000)
          if (-not $finished) { $p.Kill() }
          "---- log ----"; Get-Content "$env:KAYEI_OSA_HOME\kayei_spectrumstudio.log" -Tail 40 -ErrorAction SilentlyContinue; "---- end ----"
          if (-not $finished) { throw "smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:KAYEI_OSA_HOME\kayei_spectrumstudio.log" -Pattern "SMOKE-QT OK" -Quiet)) { throw "no SMOKE-QT OK in the log" }
          $r = Start-Process -FilePath "dist\kayei_spectrumstudio\kayei_spectrumstudio.exe" -ArgumentList "sweep","--simulate","--start","1000","--stop","1100","--out","$env:RUNNER_TEMP\demo.csv","--png","$env:RUNNER_TEMP\demo.png" -PassThru -Wait
          if ($r.ExitCode -ne 0) { throw "headless 'sweep' failed: $($r.ExitCode)" }
          if (-not (Test-Path "$env:RUNNER_TEMP\demo_anal.csv")) { throw "headless sweep wrote no analysis" }
          if (-not (Test-Path "$env:RUNNER_TEMP\demo.png")) { throw "headless sweep wrote no plot" }

      - name: Code signing (only when a certificate secret is configured)
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) { "No WINDOWS_CERT_PFX secret: building unsigned."; exit 0 }
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          $cmd = "`"$($signtool.FullName)`" sign /f `"$pfx`" /p `"$env:CERT_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
          "KAYEI_SIGN_CMD=$cmd" >> $env:GITHUB_ENV

      - name: Sign the app (only with a certificate)
        shell: pwsh
        run: if ($env:KAYEI_SIGN_CMD) { python packaging/build_exe.py --sign-only } else { "unsigned build" }

      - name: Portable zip, checksums and sizes
        shell: pwsh
        run: |
          $zip = "dist\kayEi-SpectrumStudio-portable-${{ steps.ver.outputs.version }}.zip"
          $ProgressPreference = "SilentlyContinue"
          Compress-Archive -Path "dist\kayei_spectrumstudio\*" -DestinationPath $zip
          $sums = Get-ChildItem dist -File | Where-Object { $_.Extension -eq ".zip" } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"
          Get-ChildItem dist -File | ForEach-Object { '{0}: {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      - name: Portable zip test (unpack somewhere else, run the self-test from there)
        shell: pwsh
        run: |
          $env:KAYEI_OSA_HOME = "$env:RUNNER_TEMP\kayei-portable"
          $dir = "$env:RUNNER_TEMP\portable"
          Expand-Archive -Path "dist\kayEi-SpectrumStudio-portable-${{ steps.ver.outputs.version }}.zip" -DestinationPath $dir
          $exe = "$dir\kayei_spectrumstudio.exe"
          if (-not (Test-Path $exe)) { throw "the zip has no kayei_spectrumstudio.exe at its root" }
          $r = Start-Process $exe -ArgumentList "--smoke" -PassThru
          if (-not $r.WaitForExit(180000)) { $r.Kill(); throw "portable smoke test timed out" }
          "---- log ----"; Get-Content "$env:KAYEI_OSA_HOME\kayei_spectrumstudio.log" -Tail 20 -ErrorAction SilentlyContinue; "---- end ----"
          if ($r.ExitCode -ne 0) { throw "portable smoke test failed: $($r.ExitCode)" }
          if (-not (Select-String -Path "$env:KAYEI_OSA_HOME\kayei_spectrumstudio.log" -Pattern "SMOKE-QT OK" -Quiet)) { throw "no SMOKE-QT OK in the log" }
          "portable zip runs OK"

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        with:
          name: kayEi-SpectrumStudio-portable-${{ steps.ver.outputs.version }}
          path: |
            dist/kayEi-SpectrumStudio-portable-*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish release (version tag, a new version on main, or a manual run with 'release' ticked)
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.ver.outputs.untagged == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: kayEi SpectrumStudio ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/kayEi-SpectrumStudio-portable-*.zip
            dist/SHA256SUMS.txt
