name: Build Linux app

on:
  push:
    # Linux is optional: every push to main and every tag builds; a push to another branch
    # builds only when the commit message carries [linux]
    branches: [main, master, "claude/**"]
    tags: ["v*"]
    paths:
      - ando_osa/**
      - osa_qt/**
      - assets/**
      - packaging/**
      - requirements*.txt
      - .github/workflows/build-linux.yml
  workflow_dispatch:
    inputs:
      release:
        description: "Attach to the GitHub release v<version> (created if missing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux-app:
    runs-on: ubuntu-22.04
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[linux]')
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      KAYEI_OSA_HOME: ${{ github.workspace }}/.kayei-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Desktop libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libgl1 libdbus-1-3 fonts-dejavu-core

      - name: Install
        run: python -m pip install -r requirements-desktop.txt -r packaging/requirements-build.txt

      - name: Version
        id: ver
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'packaging'); import build_exe; print(build_exe.version())")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "tag $GITHUB_REF_NAME does not match ando_osa.__version__ $v"; exit 1
          fi
          tagged=$(git ls-remote --tags origin "refs/tags/v$v")
          echo "untagged=$([[ -z "$tagged" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: python packaging/build_exe.py --bundle

      - name: Smoke test (the packaged app opens, sweeps the simulator, exits; headless sweep works)
        shell: bash
        run: |
          mkdir -p "$KAYEI_OSA_HOME"
          exe="dist/kayei_spectrumstudio/kayei_spectrumstudio"
          set +e
          timeout 240 "$exe" --smoke > "$RUNNER_TEMP/smoke.out" 2>&1
          rc=$?
          set -e
          echo "---- output ----"; tail -30 "$RUNNER_TEMP/smoke.out"
          if [[ $rc -ne 0 ]]; then echo "smoke exit $rc"; exit 1; fi
          grep -q "SMOKE-QT OK" "$RUNNER_TEMP/smoke.out"
          "$exe" sweep --simulate --start 1000 --stop 1100 --out "$RUNNER_TEMP/demo.csv" --png "$RUNNER_TEMP/demo.png"
          test -s "$RUNNER_TEMP/demo_anal.csv" && test -s "$RUNNER_TEMP/demo.png"

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt; ls -la

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        with:
          name: kayEi-SpectrumStudio-${{ steps.ver.outputs.version }}-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
          retention-days: 14

      - name: Publish release (version tag, a new version on main, or a manual run with 'release' ticked)
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.ver.outputs.untagged == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: kayEi SpectrumStudio ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
