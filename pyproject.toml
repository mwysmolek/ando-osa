[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ando-osa"
dynamic = ["version"]
description = "kayEi SpectrumStudio: control, analysis and time-lapse for Ando AQ63xx optical spectrum analyzers over GPIB/VISA"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "wysmolek", email = "wysmolek@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "pyvisa>=1.11",
    "pyvisa-py>=0.7",
    "numpy>=1.20",
    "matplotlib>=3.5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<6.12"]
dev = ["pytest>=8.0", "ruff"]

[project.scripts]
ando-osa = "ando_osa.cli:main"

[project.gui-scripts]
kayei-spectrumstudio = "osa_qt.app:main"

[tool.setuptools]
packages = ["ando_osa", "osa_qt", "osa_qt.pages"]

[tool.setuptools.dynamic]
version = { attr = "ando_osa.__version__" }

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E9", "F", "E", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
